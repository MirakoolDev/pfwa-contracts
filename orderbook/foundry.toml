[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"

remappings = [
  "v4-core/=lib/v4-periphery/lib/v4-core/",
  "v4-periphery/=lib/v4-periphery/",
  "forge-std/=lib/v4-periphery/lib/v4-core/lib/forge-std/src/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "openzeppelin-contracts/=lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/",
]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
